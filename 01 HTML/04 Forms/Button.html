<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>

<body>
    <form action="/server">
        <input type="text" placeholder="Enter your Name  ">
        <br />
        <button>Submit</button>
        <!-- <button>Hello</button> -->
        <!-- Default behaviour of buttons is of submit -->
        <!-- To prevent this we use type -->

        <br />
        <br />
        <br />
        <button type="submit">Submit Button</button>
        <button type="reset">Reset Button</button>
        <button type="button">Do Something</button>

        <br />
        <br />
        <br />
        Using Input
        <!-- Another button -->
         <p>Default</p>
        <input type="button">
        <p>value attribute</p>
        <input type="button" value="Button">
        <p>Making button actionable</p>
        <input type="submit">
    </form>
</body>

</html>
