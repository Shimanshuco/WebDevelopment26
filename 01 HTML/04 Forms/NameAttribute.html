<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <!-- Name of the form control. Submitted with the form as part of a name/value pair -->
    <form action="/server"">
        <label for="uname">Enter your Name : </label>
        <input type="text" id="uname" placeholder="Enter your username" name="name"><br/>
        <label for="pass">Enter your Pass. : </label>
        <input type="password" id="pass" placeholder="Enter your password" name="passw">
        <br/>
        <button type="submit">submit</button>
     </form>    
    <!-- Now after cliking submit we see our url : http://127.0.0.1:5500/server?name=dfdf&passw=dfdf -->
</body>
</html>
