<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="#">
        <!-- Simple -->
         <input type="radio" name="radiobutton" id="radiobutton" value="radiobutton">

         <br/>
         <br/>

        <p>Fruits you Like most : </p>
        <input type="radio" name="fruits" id="apple" value="apple">
        <label for="apple">Apple</label>
        <input type="radio" name="fruits" id="mango" value="mango">
        <label for="mango">Mango</label>
        <input type="radio" name="fruits" id="guava" value="guava">
        <label for="mango">Guava</label>
        <br/>
        <br/>
        <button>Submit</button>
    </form>
