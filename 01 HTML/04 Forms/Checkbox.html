<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>
<body>
    <form action="#">
        <!-- Basic -->
        <input type="checkbox" name="age" id="age">
        <label for="age">18+ </label>

        <!-- checked attribute makes it by default checked -->
         <br/>
            Choose your Subject : 
        <input type="checkbox" name="subjects" id="java" value="java">
        <label for="java">Java </label>

        <input type="checkbox" name="subjects" id="c++" value="c++">
        <label for="c++">C++ </label>

        <input type="checkbox" name="subjects" id="cloud" value="cloudcomputing">
        <label for="cloud">Cloud Computing </label>

        <button>Submit</button>
    </form>
</body>
</html>
