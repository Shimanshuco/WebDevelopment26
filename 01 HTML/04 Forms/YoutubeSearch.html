<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name attribute</title>
</head>
<body>
    <h1><marquee>Search on Youtube : </marquee></h1>
    <hr/>
    <form action="https://www.youtube.com/results">
        <label for="search">Search Keyword : </label>
        <input type="text" placeholder="Search in youtube" name="search_query" id="search">
        <br/>
        <button type="submit">Search</button>
    </form>
</body>
</html>
