<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labels</title>
</head>
<body>
    <!-- Labels : (Classical Approach [for and id ]) -->
     <form>
        <label for="uname">Enter your Name : </label>
        <input type="text" id="uname" placeholder="Enter your username"><br/>
        <label for="pass">Enter your Pass. : </label>
        <input type="password" id="pass" placeholder="Enter your password">
     </form>
</body>
</html>
